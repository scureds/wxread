name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: true    # 取消任何正在进行的相同并发组的工作流

on:
  schedule:
    # 早间任务：北京时间每天 07:07（UTC 前一天 23:07），避开 GitHub Actions 整点高峰
    - cron: '7 23 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  # 保活任务独立并行运行（无需等待 deploy 步骤）
  # 工作流启动后几秒内自动刷新 GitHub 60天休眠计时器，彻底与阅读逻辑解耦
  keepalive-job:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1

  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead  # 指定环境

    steps:

    - name: Set DNS to Google's DNS
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

    - name: Generate random READ_NUM
      id: random
      run: |
        RANDOM_NUM=$((RANDOM % 19 + 120))
        echo "READ_NUM=$RANDOM_NUM" >> $GITHUB_OUTPUT
        echo "Generated READ_NUM: $RANDOM_NUM"

    - name: Run deployment script
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        READ_NUM: ${{ steps.random.outputs.READ_NUM }}  # 使用生成的随机数
      run: |
        python main.py

    - name: Trigger Callback on Failure
      if: failure()  # 仅在之前的步骤出错时运行
      run: |
        curl -X POST -H "Content-Type: application/json" \
        -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"微信阅读脚本失败，运行ID: ${{ github.run_id }}\"}}" \
        ${{ secrets.FEISHU_WEBHOOK }}

